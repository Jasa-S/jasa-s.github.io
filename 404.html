<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <script>if(matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.classList.add('dark');</script>
    <style>
        :root { color-scheme: light dark; --bg: #ffffff; }
        :root.dark { --bg: #0a0a0a; }
        html, body { background-color: var(--bg); }
        @media (prefers-color-scheme: dark) { html, body { background-color: #0a0a0a; } }
    </style>
    <title>Page not found | Jasaman Saini</title>
    <link rel="icon" href="/site-icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/shared.css">
    <style>
        body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: var(--bg); color: var(--text-main); font-family: system-ui, sans-serif; }
        main { max-width: 30rem; padding: 2rem; text-align: center; }
        h1 { margin: 0 0 0.75rem; font-size: clamp(2rem, 8vw, 4rem); }
        p { color: var(--text-muted); line-height: 1.6; }
        a { color: var(--accent); text-underline-offset: 0.2em; }
    </style>
</head>
<body>
    <main>
        <h1>404</h1>
        <p>That page is not here.</p>
        <a href="/index.html">Return home</a>
    </main>
</body>
</html>
